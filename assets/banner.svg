<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Varsha Kodi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E1BEE7">
        <animate attributeName="stop-color" values="#E1BEE7;#C8E6C9;#B3E5FC;#E1BEE7" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#C8E6C9">
        <animate attributeName="stop-color" values="#C8E6C9;#B3E5FC;#E1BEE7;#C8E6C9" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#B3E5FC">
        <animate attributeName="stop-color" values="#B3E5FC;#E1BEE7;#C8E6C9;#B3E5FC" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="280" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="150" fill="url(#glow)">
    <animate attributeName="cy" values="70;110;70" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="1010;960;1010" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="230" r="120" fill="url(#glow)">
    <animate attributeName="cx" values="170;230;170" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="230;190;230" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" fill="#4E4173" letter-spacing="1">Varsha Kodi</text>
  <text x="600" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" fill="#5E5588">exploring systems, AI and everything in between</text>
  <text x="600" y="214" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="15" fill="#6A6396" letter-spacing="2.5">CSE, BMS COLLEGE OF ENGINEERING  ·  VICE PRESIDENT, PROTOCOL BMSCE</text>
</svg>
