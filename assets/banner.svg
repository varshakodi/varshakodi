<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Varsha Kodi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E1BEE7">
        <animate attributeName="stop-color" values="#E1BEE7;#F8BBD0;#B3E5FC;#E1BEE7" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#F8BBD0">
        <animate attributeName="stop-color" values="#F8BBD0;#B3E5FC;#E1BEE7;#F8BBD0" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#B3E5FC">
        <animate attributeName="stop-color" values="#B3E5FC;#E1BEE7;#F8BBD0;#B3E5FC" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" rx="28" fill="url(#bg)"/>

  <!-- drifting soft blobs -->
  <circle cx="1010" cy="70" r="150" fill="url(#glow)">
    <animate attributeName="cy" values="70;110;70" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="1010;960;1010" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="230" r="120" fill="url(#glow)">
    <animate attributeName="cx" values="170;230;170" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="230;190;230" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="-40" r="110" fill="url(#glow)">
    <animate attributeName="cx" values="620;700;620" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- tiny floating sparkles -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="300" cy="60" r="3">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="210" r="2.5">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="180" r="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="90" r="2">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="128" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="700" fill="#5E4B8B" letter-spacing="1">Varsha Kodi</text>
  <text x="600" y="176" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="22" fill="#6B5B95">exploring systems, AI and everything in between</text>
  <text x="600" y="222" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="15" fill="#7A6BA5" letter-spacing="3">CSE  ·  BMS COLLEGE OF ENGINEERING  ·  BENGALURU</text>
</svg>
